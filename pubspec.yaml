name: chat_up
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  bloc: ^9.2.1
  cached_network_image_ce: ^4.12.0
  equatable: ^2.1.0
  envied: ^1.3.9
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_gen: ^5.15.0
  flutter_svg: ^2.3.0
  formz: ^0.8.0
  get_it: ^9.2.1
  go_router: ^17.5.0
  injectable: ^2.1.1
  intl: ^0.20.3
  logger: ^2.8.0
  pausable_timer: ^3.1.0+3
  timeago: ^3.7.1
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  rxdart: ^0.28.0
  cloud_firestore: ^6.10.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  envied_generator: ^1.3.9
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.15.0
  injectable_generator: ^2.1.5
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-ExtraLight.ttf
          weight: 200
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500

flutter_gen:
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
  output: lib/core/app_ui/generated/
  line_length: 80

  integrations:
    flutter_svg: true

dependency_overrides:
  firebase_core_web: ^3.12.0
